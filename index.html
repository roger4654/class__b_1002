<div class="app">

  <div class="nav-label">工作空間</div>

</aside>
<main class="main">

  <section class="stats"><div class="stat"><div class="stat-top"><span>今日行程</span><span class="stat-icon">◷</span></div><div class="stat-num" id="statEvents">0<em>個安排</em></div></div><div class="stat"><div class="stat-top"><span>待完成任務</span><span class="stat-icon">▢</span></div><div class="stat-num" id="statTasks">0<em>項待辦</em></div></div><div class="stat"><div class="stat-top"><span>今日完成</span><span class="stat-icon">✦</span></div><div class="stat-num" id="statDone">0<em>項完成</em></div></div></section>
  <div class="alert-strip" id="alertStrip"><div class="alert-icon">⚑</div><div class="alert-copy" id="alertCopy"></div><button id="alertAction">查看任務 →</button></div>
  <div class="content-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">今日時間軸</div><div class="panel-sub">把注意力留給當下</div></div><div class="head-controls"><div class="view-toggle"><button class="active">日</button><button id="weekToggle">週</button></div></div></div><div class="day-timeline" id="timeline"></div></section>
  <div class="right-stack"><section class="panel task-panel"><div class="panel-head"><div><div class="panel-title">任務清單</div><div class="panel-sub">記下重要的每一步</div></div><span class="tag" id="taskCount">0 項</span></div><div class="task-list" id="taskList"></div><button class="add-inline" id="addInline">＋ 新增一項任務</button></section><section class="panel week-panel"><div class="panel-head"><div><div class="panel-title">本週節奏</div><div class="panel-sub">一點一點，穩穩前進</div></div></div><div class="week-bars" id="weekBars"></div></section></div></div>
</main>
</div>
<nav class="mobile-bottom"><button class="active"><span>◷</span>今天</button><button><span>▦</span>行事曆</button><button id="mobileAllTasks"><span>✓</span>任務</button><button id="mobileNotification"><span>♧</span>提醒</button></nav>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">新增行程 / 任務</h2><button class="close" id="closeModal" aria-label="關閉">×</button></div><form id="itemForm"><div class="form-grid"><div class="field full"><label for="itemTitle">名稱</label><input id="itemTitle" required maxlength="80" placeholder="例如：準備週會簡報" /></div><div class="field"><label for="itemType">類型</label><select id="itemType"><option value="task">任務</option><option value="event">行程</option></select></div><div class="field"><label for="itemDate">日期</label><input id="itemDate" type="date" required /></div><div class="field"><label for="itemTime">開始時間</label><input id="itemTime" type="time" value="09:00" required /></div><div class="field"><label for="itemDuration">預估時間（分鐘）</label><input id="itemDuration" type="number" min="5" max="1440" step="5" value="60" required /></div><div class="field full" id="dueField"><label for="itemDue">任務期限（可選）</label><input id="itemDue" type="date" /></div><div class="field full"><label for="itemColor">分類色彩</label><select id="itemColor"><option value="purple">工作・紫色</option><option value="teal">生活・綠色</option><option value="amber">個人・橘色</option></select></div></div><div class="modal-actions"><button class="secondary" type="button" id="cancelModal">取消</button><button class="primary" type="submit">儲存</button></div></form></div></div>
<button class="ai-toggle" id="aiToggle" type="button" aria-expanded="false" aria-controls="aiPanel">✦ AI 行程助理</button>
<section class="ai-panel" id="aiPanel" aria-label="AI 行程助理" hidden>
  <div class="ai-head"><div><strong>AI 行程助理</strong><small>幫你整理每日安排與期限</small></div><button class="ai-close" id="aiClose" type="button" aria-label="關閉 AI 助理">×</button></div>
  <div class="ai-note">送出時會將你的問題與行程摘要傳送至 Firebase AI Logic / Gemini。請勿輸入密碼或機密資料。</div>
  <div class="ai-messages" id="aiMessages" role="log" aria-live="polite"></div>
  <div class="ai-suggestions"><button type="button" data-ai-prompt="今天有哪些行程和待辦？">今天有哪些安排？</button><button type="button" data-ai-prompt="哪些任務已逾期或即將到期？">最近到期任務</button></div>
  <form class="ai-composer" id="aiForm"><input id="aiInput" maxlength="500" autocomplete="off" placeholder="問問你的行程…" aria-label="輸入給 AI 助理的問題"><button id="aiSend" type="submit" disabled>送出</button></form>
</section>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const KEY='daywell-items-v1', REMIND_KEY='daywell-reminded-v1';
const today=new Date();today.setHours(0,0,0,0);
const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const shift=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtDate=d=>new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d);
const defaultItems=[
{id:'e1',title:'晨間整理與規劃',type:'event',date:iso(today),time:'08:30',duration:30,color:'teal',done:false},
{id:'t1',title:'完成產品提案初稿',type:'task',date:iso(today),time:'09:30',duration:90,due:iso(today),color:'purple',done:false},
{id:'e2',title:'設計專案同步會議',type:'event',date:iso(today),time:'11:00',duration:60,color:'amber',done:false},
{id:'t2',title:'回覆合作夥伴郵件',type:'task',date:iso(today),time:'13:30',duration:30,due:iso(shift(today,-1)),color:'red',done:false},
{id:'t3',title:'整理本週發票與收據',type:'task',date:iso(today),time:'14:30',duration:45,due:iso(shift(today,1)),color:'teal',done:false},
{id:'e3',title:'散步，讓腦袋休息一下',type:'event',date:iso(today),time:'16:00',duration:30,color:'teal',done:false},
{id:'t4',title:'準備週會簡報',type:'task',date:iso(shift(today,1)),time:'10:00',duration:60,due:iso(shift(today,2)),color:'amber',done:false},
{id:'t5',title:'更新作品集內容',type:'task',date:iso(shift(today,2)),time:'15:00',duration:90,due:iso(shift(today,4)),color:'purple',done:false},
{id:'t6',title:'繳交報帳資料',type:'task',date:iso(shift(today,-1)),time:'10:00',duration:30,due:iso(shift(today,-2)),color:'red',done:false},
];
const copyItems=value=>JSON.parse(JSON.stringify(value));
const readStoredItems=key=>{try{const stored=JSON.parse(localStorage.getItem(key));return Array.isArray(stored)?stored:null}catch{return null}};
let items=readStoredItems(KEY)||defaultItems, activeStorageKey=KEY;
let selected=new Date(today), miniMonth=new Date(today.getFullYear(),today.getMonth(),1);
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(activeStorageKey,JSON.stringify(items))}catch(error){console.warn('Local schedule backup failed:',error)}window.dispatchEvent(new CustomEvent('daywell:items-changed',{detail:{items:copyItems(items)}}))};
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function dueClass(i){if(!i.due)return 'future';const diff=daysBetween(iso(today),i.due);return diff<0?'':' '+(diff<=1?'soon':'future')}
function dueText(i){if(!i.due)return '無期限';const diff=daysBetween(iso(today),i.due);return diff<0?`逾期 ${-diff} 天`:`${diff===0?'今天到期':diff===1?'明天到期':`${diff} 天後到期`}`}
function renderDate(){ $('dateLine').textContent=fmtDate(selected);renderMini();renderAll();}
function renderMini(){const y=miniMonth.getFullYear(),m=miniMonth.getMonth();$('miniMonth').textContent=`${y}年${m+1}月`;const first=new Date(y,m,1), offset=first.getDay(), n=new Date(y,m+1,0).getDate();$('miniDates').innerHTML='';for(let i=0;i<offset;i++)$('miniDates').append(document.createElement('span'));for(let d=1;d<=n;d++){const date=new Date(y,m,d),b=document.createElement('button');b.textContent=d;if(iso(date)===iso(selected))b.classList.add('chosen');if(iso(date)===iso(today))b.classList.add('today');b.onclick=()=>{selected=date;renderDate()};$('miniDates').append(b)}}
function renderTimeline(){const list=items.filter(i=>i.date===iso(selected)).sort((a,b)=>a.time.localeCompare(b.time));const timeline=$('timeline');timeline.innerHTML='';for(let h=7;h<=20;h++){const row=document.createElement('div');row.className='time-row';const label=document.createElement('div');label.className='time-label';label.textContent=String(h).padStart(2,'0')+':00';const slot=document.createElement('div');slot.className='slot';const matches=list.filter(i=>Number(i.time.slice(0,2))===h);matches.forEach(i=>{const card=document.createElement('div');card.className=`event ${i.color||'purple'}${i.done?' done':''}`;const check=document.createElement('button');check.className='event-check';check.setAttribute('aria-label',i.done?'標記未完成':'標記完成');check.onclick=()=>toggle(i.id);const title=document.createElement('span');title.className='event-title';title.textContent=i.title;const time=document.createElement('span');time.className='event-time';time.textContent=`${i.time} · ${i.duration} 分`;card.append(check,title,time);slot.append(card)});row.append(label,slot);timeline.append(row)} }
function renderTasks(){const list=items.filter(i=>i.type==='task'&&!i.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||a.time.localeCompare(b.time));$('taskCount').textContent=`${list.length} 項待辦`;$('navCount').textContent=list.length;const box=$('taskList');box.innerHTML='';if(!list.length){box.innerHTML='<div class="empty">太棒了！目前沒有待完成任務。</div>';return}list.slice(0,5).forEach(i=>{const row=document.createElement('div');row.className='task-item';const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=i.done;check.setAttribute('aria-label','完成任務');check.onchange=()=>toggle(i.id);const info=document.createElement('div');info.className='task-info';const title=document.createElement('div');title.className='task-title';title.textContent=i.title;const meta=document.createElement('div');meta.className='task-meta';const due=document.createElement('span');due.className='due'+dueClass(i);due.textContent=dueText(i);const time=document.createElement('span');time.textContent=`${i.date===iso(selected)?'今天':new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric'}).format(parse(i.date))} · ${i.time}`;const tag=document.createElement('span');tag.className='tag';tag.textContent=i.duration+' 分鐘';meta.append(due,time,tag);info.append(title,meta);row.append(check,info);box.append(row)});}
function renderAlerts(){const due=items.filter(i=>i.type==='task'&&!i.done&&i.due).map(i=>({i,d:daysBetween(iso(today),i.due)})).filter(x=>x.d<=1).sort((a,b)=>a.d-b.d);const overdue=due.filter(x=>x.d<0), soon=due.filter(x=>x.d>=0);const strip=$('alertStrip');if(!due.length){strip.style.display='none';return}strip.style.display='flex';let parts=[];if(overdue.length)parts.push(`<strong>${overdue.length} 項任務已逾期</strong>`);if(soon.length)parts.push(`<strong>${soon.length} 項任務即將到期</strong>`);$('alertCopy').innerHTML=`${parts.join('、')}<br><span>${[...overdue,...soon].slice(0,3).map(x=>`${esc(x.i.title)}（${x.d<0?'逾期':x.d===0?'今天':'明天'}）`).join('　·　')}</span>`;}
function renderStats(){const day=items.filter(i=>i.date===iso(selected));$('statEvents').innerHTML=`${day.filter(i=>i.type==='event').length}<em>個安排</em>`;$('statTasks').innerHTML=`${day.filter(i=>i.type==='task'&&!i.done).length}<em>項待辦</em>`;$('statDone').innerHTML=`${day.filter(i=>i.done).length}<em>項完成</em>`}
function renderWeek(){const start=shift(selected,-selected.getDay());$('weekBars').innerHTML='';for(let n=0;n<7;n++){const d=shift(start,n),count=items.filter(i=>i.date===iso(d)).length,el=document.createElement('div');el.className='week-day'+(iso(d)===iso(selected)?' active':'');el.innerHTML=`<span>${'日一二三四五六'[n]}</span><b>${d.getDate()}</b><div class="bar"><i style="width:${Math.min(100,count*22)}%"></i></div>`;el.onclick=()=>{selected=d;renderDate()};$('weekBars').append(el)}}
function renderAll(){renderTimeline();renderTasks();renderAlerts();renderStats();renderWeek()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggle(id){items=items.map(i=>i.id===id?{...i,done:!i.done}:i);save();renderAll();toast('已更新任務狀態')}
let toastTimer;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}window.daywellToast=toast;
window.daywellData={getItems:()=>copyItems(items),setOwner(uid){activeStorageKey=uid?`${KEY}:user:${uid}`:KEY;const stored=readStoredItems(activeStorageKey);if(stored)items=stored;else if(!uid)items=copyItems(defaultItems);renderAll();return copyItems(items)},setItems(next,uid){activeStorageKey=uid?`${KEY}:user:${uid}`:KEY;items=Array.isArray(next)?copyItems(next):[];try{localStorage.setItem(activeStorageKey,JSON.stringify(items))}catch(error){console.warn('Local schedule backup failed:',error)}renderAll()}};
function openModal(type='task'){ $('itemType').value=type;$('itemDate').value=iso(selected);$('itemDue').value=type==='task'?iso(selected):'';$('dueField').style.display=type==='task'?'grid':'none';$('modalBackdrop').classList.add('open');setTimeout(()=>$('itemTitle').focus(),30)}function closeModal(){$('modalBackdrop').classList.remove('open')}
$('itemType').onchange=e=>{$('dueField').style.display=e.target.value==='task'?'grid':'none'};
$('itemForm').onsubmit=e=>{e.preventDefault();const type=$('itemType').value;const item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:$('itemTitle').value.trim(),type,date:$('itemDate').value,time:$('itemTime').value,duration:Number($('itemDuration').value),due:type==='task'?$('itemDue').value:'',color:$('itemColor').value,done:false};if(!item.title)return;items.push(item);selected=parse(item.date);miniMonth=new Date(selected.getFullYear(),selected.getMonth(),1);save();closeModal();e.target.reset();$('itemTime').value='09:00';$('itemDuration').value='60';renderDate();toast('已新增並儲存')};
$('addTop').onclick=()=>openModal();$('addMobile').onclick=()=>openModal();$('addInline').onclick=()=>openModal('task');$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('prevDay').onclick=()=>{selected=shift(selected,-1);renderDate()};$('nextDay').onclick=()=>{selected=shift(selected,1);renderDate()};$('goToday').onclick=()=>{selected=new Date(today);miniMonth=new Date(today.getFullYear(),today.getMonth(),1);renderDate()};$('miniPrev').onclick=()=>{miniMonth=new Date(miniMonth.getFullYear(),miniMonth.getMonth()-1,1);renderMini()};$('miniNext').onclick=()=>{miniMonth=new Date(miniMonth.getFullYear(),miniMonth.getMonth()+1,1);renderMini()};
$('alertAction').onclick=()=>{$('taskList').scrollIntoView({behavior:'smooth',block:'center'});toast('待辦依期限由近到遠排列')};$('navTasks').onclick=$('mobileAllTasks').onclick=$('alertAction').onclick;$('navReminders').onclick=$('mobileNotification').onclick=()=>$('notifyBtn').click();$('weekToggle').onclick=()=>toast('已在下方顯示本週安排節奏');$('notifyBtn').onclick=async()=>{if(!('Notification'in window)){toast('此瀏覽器不支援桌面通知');return}if(Notification.permission==='granted'){toast('瀏覽器通知已啟用');checkReminders(true);return}if(Notification.permission==='denied'){toast('通知權限已封鎖，請至瀏覽器設定開啟');return}const p=await Notification.requestPermission();toast(p==='granted'?'通知已啟用，將於提醒時間提示':'尚未授權通知');checkReminders(true)};
function checkReminders(showNow=false){if(!('Notification'in window)||Notification.permission!=='granted')return;let sent;try{sent=JSON.parse(localStorage.getItem(REMIND_KEY)||'{}')}catch{sent={}}const now=new Date();items.filter(i=>i.type==='task'&&!i.done&&i.due).forEach(i=>{const diff=daysBetween(iso(today),i.due);if(diff!==0&&diff!==1)return;const date=diff===1?iso(shift(parse(i.due),-1)):i.due;const at=new Date(`${date}T${i.time||'09:00'}:00`);const key=`${i.id}:${date}`;if(sent[key]||(!showNow&&now<at))return;if(showNow&&now<at)return;try{new Notification(diff===0?'任務今天到期':'任務明天到期',{body:`${i.title} · 預計 ${i.time} 開始`,tag:key});sent[key]=Date.now()}catch{} });localStorage.setItem(REMIND_KEY,JSON.stringify(sent))}
renderDate();checkReminders();setInterval(()=>checkReminders(),60000);

})();
</script>
